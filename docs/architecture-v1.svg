<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" width="1200" height="772">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#E8ECF0"/>
    </linearGradient>
    <linearGradient id="autoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="inferenceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8C42" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D3A5C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2D3A5C" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="softShadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1A1A2E" flood-opacity="0.08"/>
    </filter>
    <filter id="zoneShadow" x="-1%" y="-1%" width="102%" height="102%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1A1A2E" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#8892A0" stroke-width="1.2"/>
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&amp;family=Space+Grotesk:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
    .zone-label { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .service-name { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 13px; }
    .service-desc { font-family: 'Space Grotesk', sans-serif; font-weight: 400; font-size: 10.5px; fill: #6B7280; }
    .desk-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 18px; fill: #1A1A2E; }
    .desk-subtitle { font-family: 'Space Grotesk', sans-serif; font-weight: 400; font-size: 11px; fill: #6B7280; }
    .conn-label { font-family: 'Space Grotesk', sans-serif; font-weight: 400; font-size: 10px; fill: #6B7280; }
    .external-label { font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; fill: #6B7280; }
    .step-label { font-family: 'Space Grotesk', sans-serif; font-weight: 400; font-size: 10px; fill: #B89B00; }
  </style>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1200" height="772" rx="0" fill="url(#bgGrad)"/>

  <!-- ==================== ZONE: CLIENT DEVICES ==================== -->
  <!-- 3 cards centered: voice.sh(140) + 20 + App(160) + 20 + Any(130) = 470 -->
  <!-- Zone: x=330, w=540, center=600. Cards start at 600-235=365, end at 835. Margins: 35 each -->
  <rect x="330" y="18" width="540" height="58" rx="14" fill="#8892A0" fill-opacity="0.07" stroke="#8892A0" stroke-opacity="0.15" stroke-width="1"/>
  <text x="600" y="35" class="external-label" fill="#6B7280" text-anchor="middle">CLIENTS</text>
  <rect x="365" y="42" width="140" height="28" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1" filter="url(#softShadow)"/>
  <text x="435" y="61" class="service-name" fill="#1A1A2E" text-anchor="middle">&#x1F4BB; voice.sh</text>
  <rect x="525" y="42" width="160" height="28" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1" filter="url(#softShadow)"/>
  <image x="536" y="45" width="20" height="20" href="data:image/png;base64,"/>
  <text x="615" y="61" class="service-name" fill="#1A1A2E" text-anchor="middle">STMNA_Voice App</text>
  <rect x="705" y="42" width="130" height="28" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1" filter="url(#softShadow)"/>
  <text x="770" y="61" class="service-name" fill="#1A1A2E" text-anchor="middle">&#x1F310; Any client</text>

  <!-- ==================== BIDIRECTIONAL: Clients <-> Caddy (HTTPS) ==================== -->
  <line x1="593" y1="76" x2="593" y2="152" stroke="#8892A0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <line x1="607" y1="152" x2="607" y2="76" stroke="#8892A0" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <!-- HTTPS badge centered on x=600 (between the two arrows) -->
  <rect x="570" y="103" width="60" height="20" rx="6" fill="#E8ECF0" stroke="#8892A0" stroke-opacity="0.3" stroke-width="0.8"/>
  <text x="600" y="117" class="conn-label" text-anchor="middle">&#x1F512; HTTPS</text>

  <!-- ==================== ZONE: VPS (gateway) ==================== -->
  <rect x="380" y="152" width="440" height="62" rx="14" fill="#8892A0" fill-opacity="0.07" stroke="#8892A0" stroke-opacity="0.15" stroke-width="1"/>
  <text x="396" y="168" class="external-label" fill="#6B7280">VPS GATEWAY</text>
  <rect x="480" y="170" width="240" height="38" rx="8" fill="#FFFFFF" stroke="#C9CED6" stroke-width="1" filter="url(#softShadow)"/>
  <text x="600" y="186" class="service-name" fill="#1A1A2E" text-anchor="middle">&#x1F6E1; Caddy</text>
  <text x="600" y="200" class="service-desc" text-anchor="middle">HTTPS + Bearer Auth (YOURDOMAIN.COM)</text>

  <!-- ==================== BIDIRECTIONAL: Caddy <-> n8n (VPN/LAN, continuous) ==================== -->
  <line x1="593" y1="214" x2="593" y2="362" stroke="#8892A0" stroke-width="1.2" stroke-dasharray="5,3" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="607" y1="362" x2="607" y2="214" stroke="#8892A0" stroke-width="1.2" stroke-dasharray="5,3" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <rect x="520" y="240" width="160" height="20" rx="6" fill="#E8ECF0" stroke="#8892A0" stroke-opacity="0.3" stroke-width="0.8"/>
  <text x="600" y="254" class="conn-label" text-anchor="middle">&#x1F510; Tailscale VPN / LAN</text>

  <!-- ==================== DESK BOUNDARY ==================== -->
  <rect x="40" y="290" width="1120" height="440" rx="18" fill="none" stroke="#2D3A5C" stroke-opacity="0.2" stroke-width="1.5"/>
  <text x="80" y="316" class="desk-title">STMNA</text>
  <text x="132" y="316" style="font-family:'JetBrains Mono',monospace; font-weight:800; font-size:18px; fill:#FF8C42">_</text>
  <text x="141" y="316" class="desk-title" style="fill:#5390D9">Desk</text>
  <text x="198" y="316" class="desk-subtitle">Framework Desktop &#xB7; 128 GB &#xB7; AMD Strix Halo</text>

  <!-- ==================== ZONE: ORCHESTRATION (n8n) ==================== -->
  <rect x="70" y="332" width="1060" height="100" rx="14" fill="url(#autoGrad)" stroke="#FFD700" stroke-opacity="0.2" stroke-width="1" filter="url(#zoneShadow)"/>
  <text x="90" y="352" class="zone-label" fill="#B89B00">ORCHESTRATION</text>

  <!-- n8n (central hub, orange border, centered at x=600) -->
  <rect x="430" y="362" width="340" height="56" rx="10" fill="#FFFFFF" stroke="#FF8C42" stroke-width="2" filter="url(#softShadow)"/>
  <text x="600" y="386" class="service-name" fill="#1A1A2E" text-anchor="middle">&#x26A1; n8n :5678</text>
  <text x="600" y="404" class="service-desc" text-anchor="middle">Webhook &#xB7; FFmpeg &#xB7; Hallucination filter &#xB7; Delimiter wrap</text>

  <!-- Pipeline steps: right of n8n card, vertically centered in zone -->
  <!-- Zone: y=332 h=100, center=382. 5 lines at 14px = 56px block. Top = 382-28=354 -->
  <text x="790" y="366" class="step-label">1. Audio POST</text>
  <text x="790" y="380" class="step-label">2. FFmpeg convert</text>
  <text x="790" y="394" class="step-label">3. Whisper STT</text>
  <text x="790" y="408" class="step-label">4. Filter + wrap</text>
  <text x="790" y="422" class="step-label">5. Qwen polish &#x2192; return</text>


  <!-- ==================== ZONE: INFERENCE ==================== -->
  <rect x="70" y="470" width="1060" height="100" rx="14" fill="url(#inferenceGrad)" stroke="#FF8C42" stroke-opacity="0.2" stroke-width="1" filter="url(#zoneShadow)"/>
  <text x="90" y="490" class="zone-label" fill="#CC6F35">INFERENCE</text>

  <!-- Two cards centered: 280 + 40gap + 280 = 600, start at 300 -->
  <rect x="300" y="500" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#softShadow)"/>
  <text x="440" y="524" class="service-name" fill="#1A1A2E" text-anchor="middle">&#x1F399; whisper.cpp :8083</text>
  <text x="440" y="540" class="service-desc" text-anchor="middle">Vulkan &#xB7; large-v3-turbo Q5 &#xB7; bilingual</text>

  <rect x="620" y="500" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#softShadow)"/>
  <text x="760" y="524" class="service-name" fill="#1A1A2E" text-anchor="middle">&#x1F9E0; llama-swap :8081</text>
  <text x="760" y="540" class="service-desc" text-anchor="middle">Qwen3-4B Voice &#xB7; always-on persistent</text>

  <!-- ==================== ZONE: DATA (ASYNC) ==================== -->
  <!-- Taller zone (h=80) so PostgreSQL card has same top spacing as other zones -->
  <rect x="70" y="608" width="1060" height="80" rx="14" fill="url(#dataGrad)" stroke="#2D3A5C" stroke-opacity="0.12" stroke-width="1" filter="url(#zoneShadow)"/>
  <text x="90" y="628" class="zone-label" fill="#4A5568">DATA (ASYNC)</text>

  <!-- PostgreSQL centered at x=600, with matching top padding -->
  <rect x="460" y="638" width="280" height="38" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#softShadow)"/>
  <text x="600" y="656" class="service-name" fill="#1A1A2E" text-anchor="middle">&#x1F5C4; PostgreSQL :5432</text>
  <text x="600" y="670" class="service-desc" text-anchor="middle">Training pairs + latency metrics</text>

  <!-- ==================== CONNECTION ARROWS (n8n to services) ==================== -->

  <!-- n8n to whisper.cpp -->
  <path d="M560,418 L560,455 Q560,460 555,460 L445,460 Q440,460 440,465 L440,500" fill="none" stroke="#8892A0" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- n8n to llama-swap -->
  <path d="M640,418 L640,455 Q640,460 645,460 L755,460 Q760,460 760,465 L760,500" fill="none" stroke="#8892A0" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- n8n to PostgreSQL (async dashed, no label) -->
  <path d="M600,418 L600,638" fill="none" stroke="#8892A0" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ==================== STMNA_ BRAND WORDMARK ==================== -->
  <text x="1062" y="752" style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; fill:#1A1A2E">STMNA</text>
  <text x="1113" y="752" style="font-family:'JetBrains Mono',monospace; font-weight:800; font-size:18px; fill:#FF8C42">_</text>

  <!-- ==================== LEGEND ==================== -->
  <g transform="translate(50, 88)">
    <text x="0" y="12" class="zone-label" fill="#6B7280" style="font-size:11px">LEGEND</text>
    <line x1="0" y1="30" x2="32" y2="30" stroke="#8892A0" stroke-width="1.2"/>
    <text x="40" y="34" class="service-desc" style="font-size:11px">Internal connection</text>
    <line x1="0" y1="48" x2="32" y2="48" stroke="#8892A0" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="40" y="52" class="service-desc" style="font-size:11px">HTTPS (secure remote)</text>
    <line x1="0" y1="66" x2="32" y2="66" stroke="#8892A0" stroke-width="1.2" stroke-dasharray="5,3" stroke-opacity="0.5"/>
    <text x="40" y="70" class="service-desc" style="font-size:11px">Tailscale VPN / LAN</text>
    <line x1="0" y1="84" x2="32" y2="84" stroke="#8892A0" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="40" y="88" class="service-desc" style="font-size:11px">Async (non-blocking)</text>
    <rect x="0" y="98" width="32" height="11" rx="3" fill="none" stroke="#FF8C42" stroke-width="2"/>
    <text x="40" y="108" class="service-desc" style="font-size:11px">Central hub (n8n)</text>
  </g>

  <!-- ==================== CONTAINER COUNT BADGE ==================== -->
  <text x="1100" y="316" class="desk-subtitle" style="font-size:10px; fill:#8892A0" text-anchor="end">3 rootless Podman containers</text>

</svg>
